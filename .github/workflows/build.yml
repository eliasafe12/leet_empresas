name: Build Leet Empresasx

on:
  push:
    tags:
      - "v*"

jobs:

  build-linux:
    name: Linux
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Gerar executável
        run: |
          pyinstaller LeetEmpresas.spec

      - name: Compactar
        run: |
          cd dist
          zip -r LeetEmpresas-Linux.zip LeetEmpresas

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: LeetEmpresas-Linux
          path: dist/LeetEmpresas-Linux.zip


  build-windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Gerar executável
        run: |
          pyinstaller LeetEmpresas.spec

      - name: Compactar
        run: |
          Compress-Archive -Path dist/LeetEmpresas -DestinationPath dist/LeetEmpresas-Windows.zip

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: LeetEmpresas-Windows
          path: dist/LeetEmpresas-Windows.zip


  build-macos:
    name: macOS
    runs-on: macos-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Gerar executável
        run: |
          pyinstaller LeetEmpresas.spec

      - name: Compactar
        run: |
          cd dist
          zip -r LeetEmpresas-macOS.zip LeetEmpresas

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: LeetEmpresas-macOS
          path: dist/LeetEmpresas-macOS.zip
